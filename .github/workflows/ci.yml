# Comprobaciones automáticas en cada cambio (push y pull request).
# - comprobaciones: lint, tipos, pruebas de lógica y de base de datos (PGlite) y build.
# - e2e: recorridos completos en el navegador contra un Supabase LOCAL que se crea
#   y se destruye en la propia máquina de GitHub. Nunca toca «Convivo pruebas» ni
#   producción, y no necesita ninguna clave real: las de Supabase local son de
#   desarrollo y CRON_SECRET / SIGNAL_SECRET se generan al vuelo.
# - secretos: gitleaks recorre TODO el historial de git y falla si encuentra una clave
#   o un secreto. Versión y hash fijados; los valores encontrados nunca salen en el log.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  comprobaciones:
    name: Lint, tipos, pruebas y build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  secretos:
    name: Buscar claves y secretos en el historial (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # historial completo, no solo el último commit
      - name: Instalar gitleaks (versión y hash fijados)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Escanear el historial (valores ocultos en el log)
        run: '"$RUNNER_TEMP/gitleaks" git --redact=100 --no-banner --verbose .'

  e2e:
    name: Pruebas e2e (navegador + Supabase local)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Arrancar Supabase local (migraciones + datos de ejemplo)
        run: npx supabase start -x studio,imgproxy,vector,logflare,edge-runtime,supavisor,postgres-meta

      - name: Variables para las pruebas (.env.local, solo en esta máquina)
        run: |
          eval "$(npx supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "MAILPIT_URL=$MAILPIT_URL"
            echo "CRON_SECRET=$(openssl rand -hex 32)"
            echo "SIGNAL_SECRET=$(openssl rand -hex 32)"
          } > .env.local

      - name: Instalar Chromium para Playwright
        run: npx playwright install --with-deps chromium

      - run: npm run build

      - name: Pruebas e2e
        run: npx playwright test

      - name: Informe de Playwright si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Parar Supabase local
        if: always()
        run: npx supabase stop --no-backup
